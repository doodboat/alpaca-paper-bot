services:
  - type: worker
    name: alpaca-paper-bot
    runtime: python
    plan: 0.5c-512mb
    region: virginia
    autoDeployTrigger: "off"
    buildCommand: pip install -r requirements.txt && python -m unittest discover -s tests
    startCommand: python -u -m paperbot.host
    envVars:
      - key: PAPERBOT_MODE
        value: setup
      - key: PAPERBOT_STATE_DIR
        value: /var/data/paperbot
      - key: PYTHONUNBUFFERED
        value: "1"
    disk:
      name: paperbot-state
      mountPath: /var/data
      sizeGB: 1
